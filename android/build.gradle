// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// The looping reminder buzz starts from the notification plugin. npm install
// replaces that plugin, so copy the patched receivers back before it compiles.
gradle.projectsEvaluated {
    def notifications = rootProject.subprojects.find { it.name == "capacitor-local-notifications" }
    if (notifications != null) {
        def patchReminderBuzz = tasks.register("patchReminderBuzz") {
            doLast {
                copy {
                    from("${rootDir}/patches/local-notifications")
                    into(new File(notifications.projectDir, "src/main/kotlin/com/capacitorjs/plugins/localnotifications"))
                    include("*.kt")
                }
            }
        }
        notifications.tasks.matching { it.name == "preBuild" }.configureEach {
            dependsOn(patchReminderBuzz)
        }
    }
}
